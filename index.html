<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Library</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:30px;
}

h1{
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:30px;
}

.card{
    background:#1d1d1d;
    border-radius:12px;
    padding:15px;
}

video{
    width:100%;
    border-radius:10px;
    background:black;
}

h3{
    margin-top:12px;
}
</style>

</head>
<body>

<h1>Video Library</h1>

<div class="grid">

<div class="card">
<video controls preload="metadata">
<source src="https://github.com/USERNAME/REPO/releases/download/TAG/movie1.mp4" type="video/mp4">
</video>
<h3>Movie 1</h3>
</div>

<div class="card">
<video controls preload="metadata">
<source src="https://github.com/USERNAME/REPO/releases/download/TAG/movie2.mp4" type="video/mp4">
</video>
<h3>Movie 2</h3>
</div>

<div class="card">
<video controls preload="metadata">
<source src="https://github.com/USERNAME/REPO/releases/download/TAG/movie3.mp4" type="video/mp4">
</video>
<h3>Movie 3</h3>
</div>

</div>

</body>
</html>
