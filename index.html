<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Library</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:25px;
}

.card{
    background:#1f1f1f;
    padding:15px;
    border-radius:10px;
}

video{
    width:100%;
    border-radius:8px;
}
</style>

</head>
<body>

<h1>Video Library</h1>

<div class="grid" id="videos"></div>

<script>

const USER="gajala-sonic-solutions";
const REPO="A113";
const TAG="pixar";

const BASE=`https://github.com/${USER}/${REPO}/releases/download/${TAG}/`;

fetch("videos.json")
.then(r=>r.json())
.then(videos=>{

const container=document.getElementById("videos");

videos.forEach(video=>{

container.innerHTML+=`
<div class="card">

<video controls preload="metadata">
<source src="${BASE}${video.file}" type="video/mp4">
</video>

<h3>${video.title}</h3>

</div>
`;

});

});

</script>

</body>
</html>
